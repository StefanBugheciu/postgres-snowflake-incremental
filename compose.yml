services:
  postgres:
    image: postgres:17
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${PGDATABASE:-incremental_demo}
      POSTGRES_USER: ${PGUSER:-demo}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set a local password in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
